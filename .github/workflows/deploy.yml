name: CyberLabX CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Helm lint
        shell: powershell
        run: helm lint k8s/juiceshop-lab

      - name: Helm render check
        shell: powershell
        run: helm template ci k8s/juiceshop-lab --set studentId=ci --set namespace=ci --set-string ctfKey=ci

      - name: Build images (frontend type-check + backend)
        shell: powershell
        run: C:\tools\skaffold.exe build --kube-context kind-cyberlabx
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cyberlabx-backend
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cyberlabx-backend-role
rules:
  # Namespace lifecycle: the API creates one namespace per lab and deletes it on teardown
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Pods: read-only, used for /labs status reporting
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Everything Helm itself creates/manages when installing a lab chart
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Helm 3 stores release state as Secrets ? already covered above, listed here for clarity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cyberlabx-backend-binding
subjects:
  - kind: ServiceAccount
    name: cyberlabx-backend
    namespace: default
roleRef:
  kind: ClusterRole
  name: cyberlabx-backend-role
  apiGroup: rbac.authorization.k8s.io

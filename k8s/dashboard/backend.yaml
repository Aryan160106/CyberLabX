apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberlabx-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cyberlabx-backend
  template:
    metadata:
      labels:
        app: cyberlabx-backend
    spec:
      serviceAccountName: cyberlabx-backend
      containers:
        - name: backend
          image: cyberlabx-backend
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cyberlabx-db
                  key: password
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cyberlabx-backend-svc
  namespace: default
spec:
  selector:
    app: cyberlabx-backend
  ports:
    - port: 8000
      targetPort: 8000
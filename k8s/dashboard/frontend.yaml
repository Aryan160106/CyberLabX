apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberlabx-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cyberlabx-frontend
  template:
    metadata:
      labels:
        app: cyberlabx-frontend
    spec:
      containers:
        - name: frontend
          image: cyberlabx-frontend
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cyberlabx-frontend-svc
  namespace: default
spec:
  selector:
    app: cyberlabx-frontend
  ports:
    - port: 80
      targetPort: 80

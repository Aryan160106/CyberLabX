apiVersion: v1
kind: Service
metadata:
  name: juiceshop-{{ .Values.studentId }}-svc
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: juiceshop
    student: {{ .Values.studentId }}
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: {{ .Values.nodePort }}

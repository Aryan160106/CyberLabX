apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cyberlabx-postgres-pvc
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberlabx-postgres
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cyberlabx-postgres
  template:
    metadata:
      labels:
        app: cyberlabx-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: cyberlabx
            - name: POSTGRES_USER
              value: cyberlabx
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cyberlabx-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cyberlabx"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cyberlabx-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cyberlabx-postgres
  namespace: default
spec:
  selector:
    app: cyberlabx-postgres
  ports:
    - port: 5432
      targetPort: 5432